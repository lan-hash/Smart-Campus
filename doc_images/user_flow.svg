<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="auto">
<defs>
  <style>
    .t { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 13px; fill: #171717; }
    .th { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; font-weight: 600; fill: #171717; }
    .ts { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 11px; fill: #52525B; }
    .arr { stroke: #A1A1AA; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .box { rx: 8; }
    .pill { rx: 999; }
  </style>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1 1 L7 4 L1 7 Z" fill="#A1A1AA"/>
  </marker>
</defs>

<text x="360" y="30" text-anchor="middle" class="th" font-size="16">用户模块 · 核心功能链路</text>

<!-- 注册 -->
<rect x="40" y="60" width="140" height="36" class="box pill" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="110" y="82" text-anchor="middle" class="t" fill="#1A1759">注册 (/register)</text>

<!-- 登录 -->
<rect x="220" y="60" width="140" height="36" class="box pill" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="290" y="82" text-anchor="middle" class="t" fill="#1A1759">登录 (/login)</text>

<!-- 获取信息 -->
<rect x="400" y="60" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="470" y="82" text-anchor="middle" class="t" fill="#1A1759">获取用户信息</text>

<!-- 个人资料 -->
<rect x="580" y="60" width="120" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="640" y="82" text-anchor="middle" class="t" fill="#1A1759">修改资料</text>

<!-- 校园认证 -->
<rect x="40" y="130" width="140" height="36" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="110" y="152" text-anchor="middle" class="t" fill="#1A1759">校园认证</text>

<!-- 头像上传 -->
<rect x="220" y="130" width="140" height="36" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="290" y="152" text-anchor="middle" class="t" fill="#1A1759">头像上传 (OSS)</text>

<!-- 社交关系 -->
<rect x="400" y="130" width="300" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="550" y="152" text-anchor="middle" class="t" fill="#1A1759">关注 / 拉黑 / 粉丝列表</text>

<!-- 箭头连接 -->
<line x1="110" y1="96" x2="110" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="96" x2="290" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="180" y1="78" x2="220" y2="78" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="78" x2="400" y2="78" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="78" x2="580" y2="78" class="arr" marker-end="url(#arrow)"/>

<!-- 用户实体信息 -->
<rect x="40" y="210" width="640" height="120" fill="#F7F7F8" stroke="#E4E4E7" rx="8"/>
<text x="60" y="240" class="ts" font-weight="600">用户实体 (SysUser)</text>
<rect x="60" y="260" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="130" y="282" text-anchor="middle" class="t" font-size="11" fill="#1A1759">id / username</text>
<rect x="220" y="260" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="290" y="282" text-anchor="middle" class="t" font-size="11" fill="#1A1759">password (BCrypt)</text>
<rect x="380" y="260" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="450" y="282" text-anchor="middle" class="t" font-size="11" fill="#1A1759">nickname / avatar</text>
<rect x="540" y="260" width="120" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="600" y="282" text-anchor="middle" class="t" font-size="11" fill="#1A1759">campus_verify</text>
</svg>