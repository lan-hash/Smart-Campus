<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" height="auto">
<defs>
  <style>
    .t { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 13px; fill: #171717; }
    .th { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; font-weight: 600; fill: #171717; }
    .ts { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 11px; fill: #52525B; }
    .arr { stroke: #A1A1AA; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .box { rx: 8; }
  </style>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1 1 L7 4 L1 7 Z" fill="#A1A1AA"/>
  </marker>
</defs>

<text x="360" y="30" text-anchor="middle" class="th" font-size="16">代课服务 · 订单状态流转</text>

<!-- 状态节点 -->
<rect x="60" y="70" width="120" height="40" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="120" y="95" text-anchor="middle" class="t" fill="#1A1759">待接单</text>

<rect x="260" y="70" width="120" height="40" class="box" fill="#FEF3C7" stroke="#D97706"/>
<text x="320" y="95" text-anchor="middle" class="t" fill="#78350F">已取消</text>

<rect x="460" y="70" width="120" height="40" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="520" y="95" text-anchor="middle" class="t" fill="#1A1759">已接单</text>

<rect x="260" y="170" width="120" height="40" class="box" fill="#EAFBF8" stroke="#0D9488"/>
<text x="320" y="195" text-anchor="middle" class="t" fill="#134E4A">已完成</text>

<rect x="460" y="170" width="120" height="40" class="box" fill="#EAFBF8" stroke="#0D9488"/>
<text x="520" y="195" text-anchor="middle" class="t" fill="#134E4A">已评价</text>

<!-- 箭头 -->
<line x1="180" y1="90" x2="260" y2="90" class="arr" marker-end="url(#arrow)"/>
<text x="220" y="82" class="ts">发布者取消</text>

<line x1="180" y1="100" x2="460" y2="100" class="arr" marker-end="url(#arrow)"/>
<text x="290" y="120" class="ts">接单者接受</text>

<line x1="520" y1="110" x2="520" y2="170" class="arr" marker-end="url(#arrow)"/>
<text x="535" y="145" class="ts">标记完成</text>

<line x1="460" y1="190" x2="380" y2="190" class="arr" marker-end="url(#arrow)"/>
<text x="390" y="210" class="ts">双方评价</text>
</svg>