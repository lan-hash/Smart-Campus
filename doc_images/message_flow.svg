<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" height="auto">
<defs>
  <style>
    .t { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 13px; fill: #171717; }
    .th { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; font-weight: 600; fill: #171717; }
    .ts { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 11px; fill: #52525B; }
    .arr { stroke: #A1A1AA; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .box { rx: 8; }
  </style>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1 1 L7 4 L1 7 Z" fill="#A1A1AA"/>
  </marker>
</defs>

<text x="360" y="30" text-anchor="middle" class="th" font-size="16">消息通知模块 · 数据流转</text>

<!-- 私信 -->
<rect x="40" y="60" width="180" height="240" fill="#F7F7F8" stroke="#E4E4E7" rx="8"/>
<text x="130" y="85" text-anchor="middle" class="ts" font-weight="600">私信聊天</text>

<rect x="60" y="100" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="130" y="122" text-anchor="middle" class="t" fill="#1A1759">发送私信</text>

<rect x="60" y="160" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="130" y="182" text-anchor="middle" class="t" fill="#1A1759">接收私信</text>

<rect x="60" y="220" width="140" height="36" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="130" y="242" text-anchor="middle" class="t" fill="#1A1759">未读计数 (Redis)</text>

<line x1="130" y1="136" x2="130" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="196" x2="130" y2="220" class="arr" marker-end="url(#arrow)"/>

<!-- 系统通知 -->
<rect x="270" y="60" width="180" height="240" fill="#F7F7F8" stroke="#E4E4E7" rx="8"/>
<text x="360" y="85" text-anchor="middle" class="ts" font-weight="600">系统通知</text>

<rect x="290" y="100" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="360" y="122" text-anchor="middle" class="t" fill="#1A1759">触发通知</text>

<rect x="290" y="160" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="360" y="182" text-anchor="middle" class="t" fill="#1A1759">推送通知</text>

<rect x="290" y="220" width="140" height="36" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="360" y="242" text-anchor="middle" class="t" fill="#1A1759">批量已读</text>

<line x1="360" y1="136" x2="360" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="196" x2="360" y2="220" class="arr" marker-end="url(#arrow)"/>

<!-- 系统公告 -->
<rect x="500" y="60" width="180" height="240" fill="#F7F7F8" stroke="#E4E4E7" rx="8"/>
<text x="590" y="85" text-anchor="middle" class="ts" font-weight="600">系统公告</text>

<rect x="520" y="100" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="590" y="122" text-anchor="middle" class="t" fill="#1A1759">管理员发布公告</text>

<rect x="520" y="160" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="590" y="182" text-anchor="middle" class="t" fill="#1A1759">全员可见</text>

<rect x="520" y="220" width="140" height="36" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="590" y="242" text-anchor="middle" class="t" fill="#1A1759">公告管理 CRUD</text>

<line x1="590" y1="136" x2="590" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="590" y1="196" x2="590" y2="220" class="arr" marker-end="url(#arrow)"/>
</svg>