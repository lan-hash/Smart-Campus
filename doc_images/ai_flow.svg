<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" height="auto">
<defs>
  <style>
    .t { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 13px; fill: #171717; }
    .th { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; font-weight: 600; fill: #171717; }
    .ts { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 11px; fill: #52525B; }
    .arr { stroke: #A1A1AA; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .box { rx: 8; }
  </style>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1 1 L7 4 L1 7 Z" fill="#A1A1AA"/>
  </marker>
</defs>

<text x="360" y="30" text-anchor="middle" class="th" font-size="16">AI 智能模块 · 服务链路</text>

<!-- AI聊天 -->
<rect x="40" y="60" width="280" height="240" fill="#F7F7F8" stroke="#E4E4E7" rx="8"/>
<text x="180" y="85" text-anchor="middle" class="ts" font-weight="600">AI 聊天助手 (Spring AI Alibaba)</text>

<rect x="60" y="100" width="240" height="36" class="box" fill="#FFFFFF" stroke="#0D9488"/>
<text x="180" y="122" text-anchor="middle" class="t" fill="#134E4A">用户发送消息</text>

<rect x="60" y="160" width="240" height="36" class="box" fill="#EAFBF8" stroke="#0D9488"/>
<text x="180" y="182" text-anchor="middle" class="t" fill="#134E4A">ChatClient.prompt() 调用</text>

<rect x="60" y="220" width="240" height="36" class="box" fill="#FFFFFF" stroke="#0D9488"/>
<text x="180" y="242" text-anchor="middle" class="t" fill="#134E4A">保存对话记录 (session_id)</text>

<line x1="180" y1="136" x2="180" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="180" y1="196" x2="180" y2="220" class="arr" marker-end="url(#arrow)"/>

<!-- 内容审核 -->
<rect x="400" y="60" width="280" height="240" fill="#F7F7F8" stroke="#E4E4E7" rx="8"/>
<text x="540" y="85" text-anchor="middle" class="ts" font-weight="600">内容智能审核</text>

<rect x="420" y="100" width="240" height="36" class="box" fill="#FFFFFF" stroke="#0D9488"/>
<text x="540" y="122" text-anchor="middle" class="t" fill="#134E4A">提交待审核文本</text>

<rect x="420" y="160" width="240" height="36" class="box" fill="#EAFBF8" stroke="#0D9488"/>
<text x="540" y="182" text-anchor="middle" class="t" fill="#134E4A">AI 判定 pass / reject</text>

<rect x="420" y="220" width="240" height="36" class="box" fill="#FFFFFF" stroke="#0D9488"/>
<text x="540" y="242" text-anchor="middle" class="t" fill="#134E4A">返回审核结果</text>

<line x1="540" y1="136" x2="540" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="196" x2="540" y2="220" class="arr" marker-end="url(#arrow)"/>
</svg>