<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" height="auto">
<defs>
  <style>
    .t { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 13px; fill: #171717; }
    .th { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; font-weight: 600; fill: #171717; }
    .ts { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 11px; fill: #52525B; }
    .arr { stroke: #A1A1AA; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .box { rx: 8; }
    .pill { rx: 999; }
  </style>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1 1 L7 4 L1 7 Z" fill="#A1A1AA"/>
  </marker>
  <marker id="arrow-brand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/>
  </marker>
</defs>

<text x="360" y="30" text-anchor="middle" class="th" font-size="16">JWT 认证流程</text>

<!-- 泳道背景 -->
<rect x="20" y="45" width="220" height="360" fill="#F7F7F8" stroke="#E4E4E7" rx="8"/>
<text x="130" y="70" text-anchor="middle" class="ts" font-weight="600">前端 (Vue3)</text>

<rect x="250" y="45" width="220" height="360" fill="#F7F7F8" stroke="#E4E4E7" rx="8"/>
<text x="360" y="70" text-anchor="middle" class="ts" font-weight="600">后端 (Spring Boot)</text>

<rect x="480" y="45" width="220" height="360" fill="#F7F7F8" stroke="#E4E4E7" rx="8"/>
<text x="590" y="70" text-anchor="middle" class="ts" font-weight="600">数据库 / 其他</text>

<!-- 前端节点 -->
<rect x="55" y="90" width="150" height="36" class="box pill" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="130" y="112" text-anchor="middle" class="t" fill="#1A1759">用户输入账号密码</text>

<rect x="55" y="150" width="150" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="130" y="172" text-anchor="middle" class="t" fill="#1A1759">调用 /user/login</text>

<rect x="55" y="210" width="150" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="130" y="232" text-anchor="middle" class="t" fill="#1A1759">存储 token 到 localStorage</text>

<rect x="55" y="270" width="150" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="130" y="292" text-anchor="middle" class="t" fill="#1A1759">请求头携带 Bearer token</text>

<rect x="55" y="350" width="150" height="36" class="box pill" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="130" y="372" text-anchor="middle" class="t" fill="#1A1759">访问受保护资源</text>

<!-- 后端节点 -->
<rect x="285" y="150" width="150" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="360" y="172" text-anchor="middle" class="t" fill="#1A1759">校验用户名密码</text>

<rect x="285" y="210" width="150" height="36" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="360" y="232" text-anchor="middle" class="t" fill="#1A1759">生成 JWT token</text>

<rect x="285" y="270" width="150" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="360" y="292" text-anchor="middle" class="t" fill="#1A1759">JwtInterceptor 拦截</text>

<rect x="285" y="330" width="150" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="360" y="352" text-anchor="middle" class="t" fill="#1A1759">解析 token 获取 userId</text>

<!-- 数据库节点 -->
<rect x="515" y="150" width="150" height="36" class="box" fill="#DBEAFE" stroke="#2563EB"/>
<text x="590" y="172" text-anchor="middle" class="t" fill="#1E3A8A">查询 sys_user</text>

<!-- 箭头 -->
<line x1="130" y1="126" x2="130" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="205" y1="168" x2="285" y2="168" class="arr" marker-end="url(#arrow-brand)"/>
<line x1="360" y1="186" x2="360" y2="210" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="228" x2="515" y2="228" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="186" x2="130" y2="210" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="246" x2="130" y2="246" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="246" x2="130" y2="270" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="306" x2="130" y2="350" class="arr" marker-end="url(#arrow)"/>
<line x1="205" y1="288" x2="285" y2="288" class="arr" marker-end="url(#arrow-brand)"/>
<line x1="360" y1="306" x2="360" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="366" x2="205" y2="366" class="arr" marker-end="url(#arrow)"/>
</svg>