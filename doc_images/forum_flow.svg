<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="auto">
<defs>
  <style>
    .t { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 13px; fill: #171717; }
    .th { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; font-weight: 600; fill: #171717; }
    .ts { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 11px; fill: #52525B; }
    .arr { stroke: #A1A1AA; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .box { rx: 8; }
    .pill { rx: 999; }
  </style>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1 1 L7 4 L1 7 Z" fill="#A1A1AA"/>
  </marker>
</defs>

<text x="360" y="30" text-anchor="middle" class="th" font-size="16">论坛模块 · 帖子生命周期</text>

<!-- 开始 -->
<rect x="310" y="55" width="100" height="32" class="box pill" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="360" y="75" text-anchor="middle" class="t" fill="#1A1759">用户访问论坛</text>

<!-- 分类浏览 -->
<rect x="280" y="110" width="160" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="360" y="133" text-anchor="middle" class="t" fill="#1A1759">浏览分类 / 帖子列表</text>

<!-- 发帖 -->
<rect x="60" y="180" width="140" height="36" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="130" y="203" text-anchor="middle" class="t" fill="#1A1759">发布新帖 (POST)</text>

<!-- 帖子详情 -->
<rect x="290" y="180" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="360" y="203" text-anchor="middle" class="t" fill="#1A1759">查看帖子详情</text>

<!-- 互动 -->
<rect x="520" y="180" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="590" y="203" text-anchor="middle" class="t" fill="#1A1759">点赞 / 收藏 / 评论</text>

<!-- 管理操作 -->
<rect x="60" y="260" width="140" height="36" class="box" fill="#FEF3C7" stroke="#D97706"/>
<text x="130" y="283" text-anchor="middle" class="t" fill="#78350F">编辑 / 删除帖子</text>

<!-- AI分类 -->
<rect x="290" y="260" width="140" height="36" class="box" fill="#EAFBF8" stroke="#0D9488"/>
<text x="360" y="283" text-anchor="middle" class="t" fill="#134E4A">AI 智能分类</text>

<!-- 个人中心 -->
<rect x="520" y="260" width="140" height="36" class="box" fill="#FFFFFF" stroke="#4B3FE3"/>
<text x="590" y="283" text-anchor="middle" class="t" fill="#1A1759">我的帖子 / 收藏</text>

<!-- 箭头 -->
<line x1="360" y1="87" x2="360" y2="110" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="146" x2="130" y2="180" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="146" x2="360" y2="180" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="146" x2="590" y2="180" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="216" x2="130" y2="260" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="216" x2="360" y2="260" class="arr" marker-end="url(#arrow)"/>
<line x1="590" y1="216" x2="590" y2="260" class="arr" marker-end="url(#arrow)"/>
</svg>