<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="100%" height="auto">
<defs>
  <style>
    .t { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 13px; fill: #171717; }
    .th { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; font-weight: 600; fill: #171717; }
    .ts { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 11px; fill: #52525B; }
    .arr { stroke: #A1A1AA; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .box { rx: 8; }
    .boundary { rx: 12; fill: none; stroke-dasharray: 5 4; stroke-width: 1.5; }
  </style>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M1 1 L7 4 L1 7 Z" fill="#A1A1AA"/>
  </marker>
</defs>

<!-- 标题 -->
<text x="360" y="30" text-anchor="middle" class="th" font-size="16">智能校园综合服务平台 · 系统架构</text>

<!-- 前端层 -->
<rect x="40" y="50" width="640" height="60" class="boundary" stroke="#A9AEFF"/>
<text x="60" y="80" class="ts" font-weight="600" fill="#3C2ECA">前端层</text>
<rect x="120" y="62" width="120" height="36" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="180" y="84" text-anchor="middle" class="t" fill="#1A1759">Vue3 + Element Plus</text>
<rect x="300" y="62" width="120" height="36" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="360" y="84" text-anchor="middle" class="t" fill="#1A1759">Pinia 状态管理</text>
<rect x="480" y="62" width="120" height="36" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="540" y="84" text-anchor="middle" class="t" fill="#1A1759">Axios / Vue Router</text>

<!-- 箭头 前端 -> 后端 -->
<line x1="360" y1="110" x2="360" y2="130" class="arr" marker-end="url(#arrow)"/>

<!-- 后端层 -->
<rect x="40" y="130" width="640" height="150" class="boundary" stroke="#4B3FE3"/>
<text x="60" y="160" class="ts" font-weight="600" fill="#3C2ECA">后端层 (Spring Boot 3.2.5)</text>

<!-- Controller -->
<rect x="60" y="170" width="100" height="40" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="110" y="195" text-anchor="middle" class="t" fill="#1A1759">Controller</text>

<!-- Service -->
<rect x="200" y="170" width="100" height="40" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="250" y="195" text-anchor="middle" class="t" fill="#1A1759">Service</text>

<!-- Mapper -->
<rect x="340" y="170" width="100" height="40" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="390" y="195" text-anchor="middle" class="t" fill="#1A1759">Mapper/XML</text>

<!-- Entity/DTO/VO -->
<rect x="480" y="170" width="100" height="40" class="box" fill="#E5EAFF" stroke="#4B3FE3"/>
<text x="530" y="195" text-anchor="middle" class="t" fill="#1A1759">Entity/DTO/VO</text>

<!-- JWT拦截器 -->
<rect x="60" y="225" width="140" height="40" class="box" fill="#FEF3C7" stroke="#D97706"/>
<text x="130" y="250" text-anchor="middle" class="t" fill="#78350F">JWT 拦截器</text>

<!-- 全局异常 -->
<rect x="240" y="225" width="140" height="40" class="box" fill="#FEF3C7" stroke="#D97706"/>
<text x="310" y="250" text-anchor="middle" class="t" fill="#78350F">全局异常处理</text>

<!-- OSS上传 -->
<rect x="420" y="225" width="120" height="40" class="box" fill="#FEF3C7" stroke="#D97706"/>
<text x="480" y="250" text-anchor="middle" class="t" fill="#78350F">OSS 上传</text>

<!-- Redis缓存 -->
<rect x="570" y="225" width="100" height="40" class="box" fill="#FEF3C7" stroke="#D97706"/>
<text x="620" y="250" text-anchor="middle" class="t" fill="#78350F">Redis</text>

<!-- 箭头 后端 -> 数据层 -->
<line x1="360" y1="280" x2="360" y2="300" class="arr" marker-end="url(#arrow)"/>

<!-- 数据层 -->
<rect x="40" y="300" width="640" height="80" class="boundary" stroke="#22A5F7"/>
<text x="60" y="330" class="ts" font-weight="600" fill="#1D4ED8">数据层</text>
<rect x="120" y="340" width="120" height="36" class="box" fill="#DBEAFE" stroke="#2563EB"/>
<text x="180" y="362" text-anchor="middle" class="t" fill="#1E3A8A">MySQL 8.0</text>
<rect x="300" y="340" width="120" height="36" class="box" fill="#DBEAFE" stroke="#2563EB"/>
<text x="360" y="362" text-anchor="middle" class="t" fill="#1E3A8A">MyBatis-Plus</text>
<rect x="480" y="340" width="120" height="36" class="box" fill="#DBEAFE" stroke="#2563EB"/>
<text x="540" y="362" text-anchor="middle" class="t" fill="#1E3A8A">Redis 缓存</text>

<!-- 箭头 后端 -> AI -->
<line x1="680" y1="205" x2="700" y2="205" class="arr" marker-end="url(#arrow)"/>
<rect x="705" y="185" width="100" height="40" class="box" fill="#EAFBF8" stroke="#0D9488"/>
<text x="755" y="210" text-anchor="middle" class="t" fill="#134E4A">Spring AI</text>

<!-- 底部模块列表 -->
<rect x="40" y="400" width="640" height="100" class="boundary" stroke="#6F6FFF"/>
<text x="60" y="430" class="ts" font-weight="600" fill="#3C2ECA">九大业务模块</text>
<rect x="55" y="445" width="65" height="40" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="87" y="468" text-anchor="middle" class="t" font-size="11" fill="#1A1759">用户模块</text>
<rect x="130" y="445" width="65" height="40" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="162" y="468" text-anchor="middle" class="t" font-size="11" fill="#1A1759">论坛模块</text>
<rect x="205" y="445" width="65" height="40" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="237" y="468" text-anchor="middle" class="t" font-size="11" fill="#1A1759">表白墙</text>
<rect x="280" y="445" width="75" height="40" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="317" y="468" text-anchor="middle" class="t" font-size="11" fill="#1A1759">二手交易</text>
<rect x="365" y="445" width="65" height="40" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="397" y="468" text-anchor="middle" class="t" font-size="11" fill="#1A1759">代课服务</text>
<rect x="440" y="445" width="65" height="40" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="472" y="468" text-anchor="middle" class="t" font-size="11" fill="#1A1759">消息通知</text>
<rect x="515" y="445" width="65" height="40" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="547" y="468" text-anchor="middle" class="t" font-size="11" fill="#1A1759">AI智能</text>
<rect x="590" y="445" width="75" height="40" class="box" fill="#F2F7FF" stroke="#4B3FE3"/>
<text x="627" y="468" text-anchor="middle" class="t" font-size="11" fill="#1A1759">后台管理</text>
</svg>